{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-logo">
                <img
                    src="{% static 'images/mukii-bot.svg' %}"
                    alt="Mukii"
                    class="brand-logo-img"
                >
            </div>

            <div class="brand-content">

                <h2>Mukii</h2>

                <p>Your AI Document Assistant</p>

            </div>

        </div>

        <nav class="sidebar-nav">

            <button class="nav-item active" type="button">

                <span class="nav-icon">💬</span>

                <span>Chat</span>

            </button>

            <button class="nav-item" type="button" id="newChatButton">

                <span class="nav-icon">✚</span>

                <span>New chat</span>

            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="welcome-card">

                <div class="welcome-icon">
                    <img src="{% static 'images/mukii-bot.svg' %}" alt="Bot" style="width: 24px; height: 24px; display: block; border-radius: 8px;">
                </div>

                <div>

                    <h4>Hello Mukund!</h4>

                    <p>Welcome back.</p>

                </div>

            </div>

        </div>

    </aside>

    <section class="content">

        <header class="header">

            <div class="header-left">

                <h1>Mukii</h1>

                <p>AI Chat Assistant</p>

            </div>

            <div class="header-right">

                <button class="theme-btn" type="button" id="themeButton">🌙</button>

                <button class="profile-btn" type="button">M</button>

            </div>

        </header>

        <main class="chat-area">

            <div
                class="chat-wrapper"
                id="chatWrapper"
                data-bot-avatar="{% static 'images/mukii-bot.svg' %}"
            ></div>

        </main>

        <footer class="chat-input">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask a question about the documents..."
                    autocomplete="off"
                >

                <button
                    class="send-btn"
                    type="button"
                    id="sendButton"
                    title="Send message"
                >➜</button>

            </div>

        </footer>

    </section>

</div>

{% endblock %}
