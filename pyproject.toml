[project]
name = "ai-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "openai>=2.45.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
]
